name = "gameboystudio-rooms"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Rooms are ephemeral and payload-blind (D-017). There is deliberately no KV
# namespace, no D1 database and no R2 bucket here: a room's only storage is the
# Durable Object's own alarm, and it holds nothing after the room empties.

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
# SQLite-backed rather than the older key-value storage: it is what the free
# plan allows, and it is the current default for new Durable Objects. Nothing
# here depends on the difference — a room's only storage is its alarm.
new_sqlite_classes = ["RoomDurableObject"]

[vars]
# Comma-separated exact origins allowed to open or join a room.
#
# Empty would mean "allow any origin", which is only correct for local
# development. A room code is a capability, and an unrestricted relay is one any
# page on the internet could point at.
#
# Vercel preview deployments get their own generated origins, so a preview build
# cannot open rooms until its origin is added here. That is the intended
# trade — a wildcard would defeat the check.
#
# `npm run relay:dev` overrides this to empty on the command line, so local
# pages and the latency script (which sends no Origin header at all) still
# connect. The committed value is the production one, so a deploy that forgets
# to think about origins is still safe.
ALLOWED_ORIGINS = "https://gameboy-jet.vercel.app"

[observability]
enabled = true
