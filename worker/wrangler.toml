name = "gameboystudio-rooms"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Rooms are ephemeral and payload-blind (D-017). There is deliberately no KV
# namespace, no D1 database and no R2 bucket here: a room's only storage is the
# Durable Object's own alarm, and it holds nothing after the room empties.

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["RoomDurableObject"]

[vars]
# Comma-separated. Empty means "allow any origin", which is only correct for
# local development — a real deployment must set this.
ALLOWED_ORIGINS = ""

[observability]
enabled = true
